paths:
  source: ../BGCRUSHER_TEST_PHOTOS
  output: benchmark_output

runtime:
  device: cuda
  precision: fp16
  count: 20
  extensions: [.jpg, .jpeg, .png, .webp]

models:
  hr_matting:
    model_id: ZhengPeng7/BiRefNet_HR-matting
    revision: 5d6b6f8adcb5b417c871b1d84ceaae9871355b7f
    image_size: 2048
  portrait:
    model_id: ZhengPeng7/BiRefNet-portrait
    revision: ecdeb6240ef23557dbd48ff27c59c1a88cbcb755
